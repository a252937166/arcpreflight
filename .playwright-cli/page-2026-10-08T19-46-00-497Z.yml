              - paragraph [ref=f3e694]: I signed one EIP-3009 authorization for exactly that quote. One authorization, one quote — the fee cannot be replayed.
              - paragraph [ref=f3e695]: "Settled on Arc (0xec1e0add…). I re-hashed the report myself: it is bound to my intent, baseline says MATCH, pinned at #66187459."
              - paragraph [ref=f3e696]: No configured check fired at the pinned block. That is not "safe" — it means I may proceed to final validation.
              - paragraph [ref=f3e811]: Time passed and the fee changed my balance, so I re-read implementation, paused state, the order, fees and the approval this intent references at a new block (#66187475) — one that must not predate the fee settlement; a fresh fetch of an old block would not count. Still consistent. Gas 40735 at 29 gwei.
              - paragraph [ref=f3e812]: I signed the plan, then decoded my own signed transaction and compared it field by field with the plan before letting it leave.
              - paragraph [ref=f3e815]: "A durable marker first: from this moment the transaction may be on the network, whatever happens to this process."
              - paragraph [ref=f3e816]: Broadcast. Now I wait for the receipt — a receipt is not an outcome.
              - paragraph [ref=f3e817]: "The order reads as paid, by me, for the exact amount, at block #66187488. That is the outcome I can prove."
