        - generic [ref=e463] [cursor=pointer]:
          - generic [ref=e464]:
            - generic [ref=e465]: ☞Approved payment, exact plan, verified outcome
            - generic [ref=e466]: ✓ confirmed
          - paragraph [ref=e467]: Baseline matches, order is payable, simulation passes. The runner re-validates at a new block after the fee is confirmed, verifies its own account path, signs exactly the validated plan, persists it, broadcasts, and proves the order reads as paid.
          - paragraph [ref=e468]:
            - generic [ref=e469]: proxy MAIN
            - generic "0xa8eb51ef994567b84215981e8d1fe17cb8e42252" [ref=e470]: 0xa8eb…2252
