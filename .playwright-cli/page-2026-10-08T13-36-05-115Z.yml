      - generic [ref=e444]:
        - generic [ref=e445] [cursor=pointer]:
          - generic [ref=e446]:
            - generic [ref=e447]: Unapproved implementation change
            - generic [ref=e448]: "! review required"
          - paragraph [ref=e449]: "The merchant proxy was approved on implementation A and later upgraded to B: same ABI, same calldata, same price, the payment would still succeed. The pinned report resolves B, the approval pins A, and the controlled signer refuses until a human approves B. No business transaction is signed or broadcast."
          - paragraph [ref=e450]:
            - generic [ref=e451]: proxy CHANGED
            - generic "0x2ff113ede634f8dd274dec71735307ae218960c1" [ref=e452]: 0x2ff1…60c1
