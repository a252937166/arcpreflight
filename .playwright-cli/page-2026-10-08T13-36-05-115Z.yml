        - generic [ref=e454] [cursor=pointer]:
          - generic [ref=e455]:
            - generic [ref=e456]: 6-decimal amount on the 18-decimal path
            - generic [ref=e457]: ✕ blocked
          - paragraph [ref=e458]: "USDC is Arc's gas: one balance, two interfaces (native 18 dec, ERC-20 6 dec). The order is for 0.05 USDC but the transaction sets native value to 50000 instead of 50000000000000000. AMOUNT_SEMANTICS explains why the amount violates the approved order; in this fixture the merchant contract would also reject it. No business transaction is signed or broadcast."
          - paragraph [ref=e459]:
            - generic [ref=e460]: proxy MAIN
            - generic "0xa8eb51ef994567b84215981e8d1fe17cb8e42252" [ref=e461]: 0xa8eb…2252
