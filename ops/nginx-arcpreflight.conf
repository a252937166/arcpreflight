server {
    listen 80;
    server_name arcpreflight.axiqo.xyz;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name arcpreflight.axiqo.xyz;
    ssl_certificate     /etc/letsencrypt/live/arcpreflight.axiqo.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcpreflight.axiqo.xyz/privkey.pem;
    client_max_body_size 128k;
    # static web (apps/web/dist) served by nginx; API proxied to the node process
    root /var/www/arcpreflight;
    index index.html;
    location /v1/     { proxy_pass http://127.0.0.1:4040; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 90s; }
    location /health/ { proxy_pass http://127.0.0.1:4040; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://127.0.0.1:4040; }
    location / { try_files $uri $uri/ /index.html; }
}
